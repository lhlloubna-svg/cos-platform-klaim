<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:14px;color:#111827;background:#fff;min-height:100vh}
:root{
  --border:#e5e7eb;--surface:#f9fafb;--muted:#6b7280;--faint:#9ca3af;
  --ok-bg:#f0fdf4;--ok:#15803d;--warn-bg:#fffbeb;--warn:#b45309;
  --err-bg:#fef2f2;--err:#dc2626;--info-bg:#eff6ff;--info:#1d4ed8;
  --accent:#0d9488
}
/* Login */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#f0fdfa,#eff6ff)}
.login-card{background:#fff;border:1px solid var(--border);border-radius:16px;padding:48px 40px;text-align:center;max-width:400px;width:100%;box-shadow:0 4px 24px rgba(0,0,0,.06)}
.logo-big{font-size:28px;font-weight:800;letter-spacing:-1px;margin-bottom:4px}
.google-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:12px 20px;border:1px solid var(--border);border-radius:8px;background:#fff;cursor:pointer;font-size:14px;font-weight:500;color:#111827;font-family:inherit;transition:all .2s;margin-bottom:12px}
.google-btn:hover{background:var(--surface);border-color:#9ca3af}
.google-btn svg{width:18px;height:18px;flex-shrink:0}
.google-btn:disabled{opacity:.5;cursor:not-allowed}
/* Setup */
.setup-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--surface)}
.setup-card{background:#fff;border:1px solid var(--border);border-radius:16px;padding:40px;max-width:440px;width:100%}
/* App */
.top-bar{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--border);padding:10px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.logo{font-weight:800;font-size:15px;letter-spacing:-.5px}
.logo em{color:var(--accent);font-style:normal}
.week-nav{display:flex;align-items:center;gap:6px}
.week-lbl{font-weight:500;font-size:12px;min-width:170px;text-align:center}
.btn-nav{border:1px solid var(--border);background:none;cursor:pointer;padding:4px 10px;border-radius:6px;color:var(--muted);font-size:14px;line-height:1;font-family:inherit}
.btn-now{font-size:11px;padding:4px 10px;border-radius:6px;border:1px solid var(--border);background:none;cursor:pointer;color:var(--muted);font-family:inherit}
.user-bar{display:flex;align-items:center;gap:8px}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex-shrink:0}
.tabs{display:flex;border-bottom:1px solid var(--border);padding:0 24px;overflow-x:auto}
.tab{padding:11px 16px;background:none;border:none;border-bottom:2px solid transparent;font-size:13px;cursor:pointer;white-space:nowrap;color:var(--muted);margin-bottom:-1px;display:flex;align-items:center;gap:5px;font-family:inherit}
.tab.on{border-bottom-color:#111827;color:#111827;font-weight:500}
.tab-okr{background:linear-gradient(135deg,#7c3aed,#5b21b6);color:#fff;border-radius:6px;border:none;margin:6px 4px;padding:5px 14px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;border-bottom:none;letter-spacing:.02em}
.tab-okr:hover{background:linear-gradient(135deg,#6d28d9,#4c1d95)}
.tab-ct{font-size:10px;font-weight:600;background:var(--err-bg);color:var(--err);border-radius:999px;padding:1px 6px}
.page{padding:20px 24px;max-width:1200px}
/* Badges */
.mb{font-size:11px;font-weight:500;padding:2px 8px;border-radius:999px;white-space:nowrap}
.mb-ok{background:var(--ok-bg);color:var(--ok)}
.mb-warn{background:var(--warn-bg);color:var(--warn)}
.mb-err{background:var(--err-bg);color:var(--err)}
.mb-info{background:var(--info-bg);color:var(--info)}
.mb-gray{background:var(--surface);color:var(--muted)}
.mb-teal{background:#f0fdfa;color:#0f766e}
/* Pills */
.pills{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:16px}
.pill{font-size:12px;padding:4px 12px;border-radius:999px;border:1px solid var(--border);background:none;cursor:pointer;color:var(--muted);font-family:inherit}
.pill.on{background:#111827;color:#fff;border-color:#111827;font-weight:500}
/* Pulse table */
.sec-block{margin-bottom:16px;border:1px solid var(--border);border-radius:10px;overflow:hidden}
.sec-head{padding:9px 14px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.sec-name{font-weight:600;font-size:13px}
.sec-meta{font-size:11px;color:var(--faint)}
.sec-badges{margin-left:auto;display:flex;gap:4px;align-items:center}
.ptable{width:100%;border-collapse:collapse;table-layout:fixed}
.ptable th{text-align:left;padding:7px 10px;font-size:10px;font-weight:500;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid var(--border)}
.ptable td{border-bottom:1px solid var(--border);vertical-align:middle}
.ptable tr:last-child td{border-bottom:none}
.kpi-cell{padding:8px 10px 8px 14px;font-size:13px;line-height:1.4;position:relative}
.sub-row td{padding:5px 10px 4px 14px;font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;background:#fafafa;border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
.ci{width:100%;border:none;background:transparent;font-size:13px;padding:8px 10px;outline:none;color:#111827;font-family:inherit}
.ci:hover,.ci:focus{background:#f5f5f5}
.ci::placeholder{color:var(--faint)}
.ci:disabled{color:var(--faint);cursor:default}
.ci-sm{font-size:12px;color:var(--muted)}
.status-sel{width:100%;border:none;background:transparent;font-size:12px;font-weight:500;padding:8px 10px;cursor:pointer;outline:none;font-family:inherit}
.status-sel:disabled{opacity:.5;cursor:default}
.add-row td{border-top:1px dashed var(--border)}
.ghost-in{width:100%;border:none;background:transparent;font-size:12px;padding:8px 14px;outline:none;color:var(--muted);font-family:inherit}
.ghost-in::placeholder{color:var(--faint)}
.upd-by{font-size:10px;color:var(--faint);padding:3px 14px 4px;font-style:italic}
/* Dashboard */
.metric-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px}
.metric-card{background:var(--surface);border-radius:8px;padding:14px 16px}
.metric-lbl{font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.metric-val{font-size:26px;font-weight:700}
.dept-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.dept-card{background:#fff;border:1px solid var(--border);border-radius:10px;padding:14px 16px}
.prog-bar{height:4px;background:var(--border);border-radius:999px;margin:8px 0 10px;overflow:hidden}
.prog-fill{height:100%;border-radius:999px;transition:width .3s}
.kpi-row-sm{display:flex;justify-content:space-between;font-size:11px;padding:2px 0;gap:8px}
/* People */
.person-card{background:#fff;border:1px solid var(--border);border-radius:10px;margin-bottom:10px;overflow:hidden}
.person-head{padding:11px 16px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.person-tasks{padding:10px 16px}
.task-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)}
.task-row:last-child{border-bottom:none}
.task-check{width:17px;height:17px;border-radius:50%;border:1.5px solid var(--border);background:none;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;font-family:inherit}
.task-check.done{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
/* Follow-ups */
.fu-table{width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed}
.fu-table th{text-align:left;padding:7px 10px;font-size:10px;font-weight:500;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid var(--border)}
.fu-table td{padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
/* Memo */
.memo-box{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:24px;font-size:13px;line-height:1.8;white-space:pre-wrap;min-height:300px;font-family:Georgia,serif}
/* Forms */
.form-blk{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:16px}
.fg{margin-bottom:10px}
.fg label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px;font-weight:500}
.fi{width:100%;font-size:13px;border:1px solid var(--border);border-radius:6px;padding:7px 10px;background:#fff;color:#111827;outline:none;font-family:inherit}
.fi:focus{border-color:#6b7280}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:10px}
.btn{font-family:inherit;cursor:pointer;border-radius:6px;font-size:13px;padding:7px 14px;border:1px solid var(--border);background:none;color:#111827}
.btn:hover:not(:disabled){background:var(--surface)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:#111827;color:#fff;border-color:#111827;font-weight:500}
.btn-primary:hover:not(:disabled){background:#374151}
.btn-accent{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:500}
.btn-accent:hover:not(:disabled){background:#0f766e}
.btn-sm{font-size:12px;padding:4px 10px}
.icon-btn{border:none;background:none;cursor:pointer;color:var(--faint);font-size:16px;line-height:1;padding:2px 4px;font-family:inherit}
/* Misc */
.alert{padding:10px 14px;border-radius:8px;font-size:12px;margin-bottom:14px;display:flex;gap:8px;line-height:1.5}
.alert-warn{background:var(--warn-bg);color:var(--warn);border:1px solid #fde68a}
.empty{padding:3rem;text-align:center;color:var(--faint);font-size:13px;border:1px dashed var(--border);border-radius:10px}
.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fw6{font-weight:600}
/* Setup guide */
.guide-wrap{max-width:680px;margin:0 auto;padding:40px 24px}
.step{display:flex;gap:16px;margin-bottom:24px}
.step-num{width:32px;height:32px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0}
.code-block{background:#f8fafc;border:1px solid var(--border);border-radius:8px;padding:16px;margin-top:12px;font-size:11px;font-family:monospace;white-space:pre-wrap;line-height:1.6;color:#374151;word-break:break-all}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{display:inline-block;animation:spin 1s linear infinite}
@media(max-width:768px){
  .page{padding:14px}
  .top-bar,.tabs{padding-left:14px;padding-right:14px}
  .metric-grid{grid-template-columns:1fr 1fr}
}
</style>

const PRIOS   = ['High','Medium','Low'];

const SS_C = {'On-Track':'#15803d','At-Risk':'#b45309','Delayed':'#b45309','Blocked':'#dc2626','Done':'#1d4ed8','N/A':'#9ca3af'};

// ---- Utilities ----
function isoWeek(d=new Date()){
  const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  t.setUTCDate(t.getUTCDate()+4-(t.getUTCDay()||7));
  const y=t.getUTCFullYear(),w=Math.ceil(((t-new Date(Date.UTC(y,0,1)))/86400000+1)/7);
  return y+'-W'+String(w).padStart(2,'0');
}
function weekLabel(wid){
  const p=wid.split('-W'),yr=+p[0],wn=+p[1];
  const jan4=new Date(Date.UTC(yr,0,4)),dw=jan4.getUTCDay()||7;
  const mon=new Date(jan4);mon.setUTCDate(jan4.getUTCDate()-dw+1+(wn-1)*7);
  const fri=new Date(mon);fri.setUTCDate(mon.getUTCDate()+4);
  const f=d=>d.toLocaleDateString('en-GB',{month:'short',day:'numeric'});
  return 'Week '+wn+' - '+f(mon)+' to '+f(fri);
}
function shiftWeek(wid,delta){
  const p=wid.split('-W'),yr=+p[0],wn=+p[1];
  const jan4=new Date(Date.UTC(yr,0,4)),dw=jan4.getUTCDay()||7;
  const mon=new Date(jan4);mon.setUTCDate(jan4.getUTCDate()-dw+1+(wn-1)*7+delta*7);
  return isoWeek(mon);
}
const uid=()=>Math.random().toString(36).slice(2,9);
const today=()=>new Date().toISOString().split('T')[0];
const numOrNull=s=>{if(!s&&s!==0)return null;const n=parseFloat(String(s).replace(/,/g,''));return isNaN(n)?null:n;};
const initials=n=>n.split(' ').map(w=>w[0]||'').join('').toUpperCase().slice(0,2)||'?';

// ---- Auth hook ----
function useAuth(){
  const[user,setUser]=useState(null);
  const[profile,setProfile]=useState(null);
  const[loading,setLoading]=useState(true);
  const[error,setError]=useState('');

  const loadProfile=useCallback(async sbUser=>{
    if(!IS_CONFIGURED||!sb){
      setUser({email:'demo@klaim.ai'});
      setProfile({email:'demo@klaim.ai',name:'Demo (configure Supabase to enable login)',section_id:'',role:'admin'});
      setLoading(false);return;
    }
    const{data}=await sb.from('klaim_users').select('*').eq('email',sbUser.email).maybeSingle();
    const isAdmin=sbUser.email===ADMIN_EMAIL;
    if(!data){
      const np={email:sbUser.email,name:sbUser.user_metadata?.full_name||sbUser.email.split('@')[0],section_id:'',role:isAdmin?'admin':'member'};
      await sb.from('klaim_users').insert(np);
      setProfile(np);
    }else{
      if(isAdmin&&data.role!=='admin'){await sb.from('klaim_users').update({role:'admin'}).eq('email',sbUser.email);data.role='admin';}
      setProfile(data);
    }
    setUser(sbUser);setLoading(false);
  },[]);

  useEffect(()=>{
    if(!IS_CONFIGURED||!sb){loadProfile(null);return;}
    sb.auth.getSession().then(({data:{session}})=>{
      if(!session){setLoading(false);return;}
      if(!session.user.email.endsWith('@'+ALLOWED)){sb.auth.signOut();setError('Only @'+ALLOWED+' accounts are allowed.');setLoading(false);return;}
      loadProfile(session.user);
    });
    const{data:{subscription}}=sb.auth.onAuthStateChange((_,session)=>{
      if(!session){setUser(null);setProfile(null);return;}
      if(!session.user.email.endsWith('@'+ALLOWED)){sb.auth.signOut();setError('Only @'+ALLOWED+' accounts allowed.');return;}
      loadProfile(session.user);
    });
    return()=>subscription.unsubscribe();
  },[]);

  const signIn=async(_email)=>{
    if(!IS_CONFIGURED||!sb)return;
    const{error:e}=await sb.auth.signInWithOtp({email:_email,options:{emailRedirectTo:window.location.href}});
    if(e)setError(e.message);else setError('Link sent! Check your inbox at '+_email);
  };
  const signOut=()=>{setUser(null);setProfile(null);if(IS_CONFIGURED)sb.auth.signOut();};
  const updateProfile=async patch=>{
    const up={...profile,...patch};
    setProfile(up);
    if(IS_CONFIGURED)await sb.from('klaim_users').update(patch).eq('email',profile.email);
  };
  return{user,profile,loading,error,signIn,signOut,updateProfile};
}

// ---- Pulse hook ----
function usePulse(weekId){
  const lsKey='klaim_pulse_'+weekId;
  const[data,setData]=useState(()=>{
    try{return JSON.parse(localStorage.getItem(lsKey)||'{}');}catch{return {};}
  });
  const[loading,setLoading]=useState(true);
  useEffect(()=>{
    setLoading(true);
    if(!IS_CONFIGURED||!sb){
      try{const d=JSON.parse(localStorage.getItem(lsKey)||'{}');setData(d);}catch{}
      setLoading(false);return;
    }
    sb.from('klaim_pulse').select('*').eq('week_id',weekId).then(({data:rows,error})=>{
      if(error)console.warn('pulse:',error.message);
      const d={};
      (rows||[]).forEach(r=>{
        if(!d[r.section_id])d[r.section_id]={};
        d[r.section_id][r.item_id]={prevWeek:r.prev_week||'',comingWeek:r.coming_week||'',status:r.status||'',comments:r.comments||'',updatedBy:r.updated_by||''};
      });
      setData(d);setLoading(false);
      try{localStorage.setItem(lsKey,JSON.stringify(d));}catch{}
    }).catch(e=>{console.warn('pulse catch:',e);setLoading(false);});
  },[weekId]);
  const updateCell=useCallback((secId,itemId,field,value,email)=>{
    setData(d=>{
      const n={...d,[secId]:{...(d[secId]||{}),[itemId]:{...(d[secId]?.[itemId]||{}),[field]:value,updatedBy:email}}};
      try{localStorage.setItem(lsKey,JSON.stringify(n));}catch{}
      return n;
    });
    if(!IS_CONFIGURED||!sb)return;
    const cm={prevWeek:'prev_week',comingWeek:'coming_week',status:'status',comments:'comments'};
    sb.from('klaim_pulse').upsert({week_id:weekId,section_id:secId,item_id:itemId,[cm[field]]:value,updated_by:email,updated_at:new Date().toISOString()},{onConflict:'week_id,section_id,item_id'});
  },[weekId]);
  return[data,updateCell,loading];
}

// ---- Custom items hook ----
function useCustom(){
  const[items,setItems]=useState({});
  useEffect(()=>{
    if(!IS_CONFIGURED||!sb)return;
    sb.from('klaim_custom_items').select('*').then(({data:rows})=>{
      const d={};(rows||[]).forEach(r=>{if(!d[r.section_id])d[r.section_id]=[];d[r.section_id].push({id:r.id,label:r.label});});
      setItems(d);
    });
  },[]);
  const add=(secId,label,existingId)=>{
    const id=existingId||uid();
    setItems(c=>({...c,[secId]:[...(c[secId]||[]),{id,label}]}));
    if(IS_CONFIGURED)sb.from('klaim_custom_items').insert({id,section_id:secId,label});
    return id;
  };
  const remove=(secId,id)=>{
    setItems(c=>({...c,[secId]:(c[secId]||[]).filter(x=>x.id!==id)}));
    if(IS_CONFIGURED)sb.from('klaim_custom_items').delete().eq('id',id);
  };
  return[items,add,remove];
}

// ---- Tasks hook ----
function useTasks(){
  const[tasks,setTasks]=useState([]);
  useEffect(()=>{
    if(!IS_CONFIGURED||!sb)return;
    sb.from('klaim_tasks').select('*').order('created_at',{ascending:false}).then(({data})=>setTasks(data||[]));
  },[]);
  const add=t=>{setTasks(ts=>[t,...ts]);if(IS_CONFIGURED)sb.from('klaim_tasks').insert(t);};
  const upd=(id,p)=>{setTasks(ts=>ts.map(x=>x.id===id?{...x,...p}:x));if(IS_CONFIGURED)sb.from('klaim_tasks').update(p).eq('id',id);};
  const del=id=>{setTasks(ts=>ts.filter(x=>x.id!==id));if(IS_CONFIGURED)sb.from('klaim_tasks').delete().eq('id',id);};
  return[tasks,add,upd,del];
}

// ---- Follow-ups hook ----
function useFUs(){
  const[fus,setFus]=useState([]);
  useEffect(()=>{
    if(!IS_CONFIGURED||!sb)return;
    sb.from('klaim_followups').select('*').order('created_at',{ascending:false}).then(({data})=>setFus(data||[]));
  },[]);
  const add=f=>{setFus(fs=>[f,...fs]);if(IS_CONFIGURED)sb.from('klaim_followups').insert(f);};
  const upd=(id,p)=>{setFus(fs=>fs.map(x=>x.id===id?{...x,...p}:x));if(IS_CONFIGURED)sb.from('klaim_followups').update(p).eq('id',id);};
  const del=id=>{setFus(fs=>fs.filter(x=>x.id!==id));if(IS_CONFIGURED)sb.from('klaim_followups').delete().eq('id',id);};
  return[fus,add,upd,del];
}

              ${rows(all.filter(i=>i.sub===sub))}`)

          ${isMine&&html`

const STAGE_LIST=[

  ['docs_shared','Docs Shared'],
  ['mrpa','MRPA Signed'],
  ['security','Security Cheqs'],
  ['bank','Bank Changed'],
  ['active','Active']
];
const STAGE_COLS={
  doc:'#6b7280',proposal:'#2563eb',docs_shared:'#0891b2',
  mrpa:'#7c3aed',security:'#d97706',bank:'#ea580c',active:'#15803d'
};
const SALES_KPIS=[
  {id:'s_dm',label:'Key DM Meetings'},
  {id:'s_walkin',label:'Walk-ins'},
  {id:'s_prop',label:'Proposals Signed'},
  {id:'s_mrpa',label:'MRPAs Signed'}
];

function getStages(d){
  try{return JSON.parse(d.comments||'{}');}catch{return {};}
}
function setStage(d,stage,val,updateCell,secId,itemId,email){
  const stages=getStages(d);
  stages[stage]=val;
  updateCell(secId,itemId,'comments',JSON.stringify(stages),email);
}
function latestStage(stages){
  const order=STAGE_LIST.map(s=>s[0]);
  for(let i=order.length-1;i>=0;i--){if(stages[order[i]])return order[i];}
  return null;
}

const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
function monthWeeks(year,month){
  const weeks=[];const seen=new Set();
  const d=new Date(year,month,1);
  while(d.getMonth()===month){
    const w=isoWeek(new Date(d));
    if(!seen.has(w)){seen.add(w);weeks.push(w);}
    d.setDate(d.getDate()+7);
  }
  return weeks;
}

function useMonthlyPulse(year,month){
  const weeks=useMemo(()=>monthWeeks(year,month),[year,month]);
  const weeksKey=useMemo(()=>weeks.join(','),[weeks]);
  const[data,setData]=useState({});
  const[loading,setLoading]=useState(false);
  useEffect(()=>{
    setLoading(true);
    if(!IS_CONFIGURED||!sb){
      const merged={};
      weeks.forEach(wk=>{
        try{
          const wd=JSON.parse(localStorage.getItem('klaim_pulse_'+wk)||'{}');
          Object.keys(wd).forEach(sec=>{
            if(!merged[sec])merged[sec]={};
            Object.keys(wd[sec]).forEach(item=>{
              if(!merged[sec][item])merged[sec][item]=[];
              merged[sec][item].push({week:wk,...wd[sec][item]});
            });
          });
        }catch{}
      });
      setData(merged);setLoading(false);return;
    }
    sb.from('klaim_pulse').select('*').in('week_id',weeks)
      .then(({data:rows})=>{
        const merged={};
        (rows||[]).forEach(r=>{
          if(!merged[r.section_id])merged[r.section_id]={};
          if(!merged[r.section_id][r.item_id])merged[r.section_id][r.item_id]=[];
          merged[r.section_id][r.item_id].push({week:r.week_id,prevWeek:r.prev_week,comingWeek:r.coming_week,status:r.status,comments:r.comments});
        });
        setData(merged);setLoading(false);
      }).catch(()=>setLoading(false));
  },[weeksKey]);
  return[data,loading,weeks];
}

function Dashboard({custom,tasks,okrs}){
  const now=new Date();
  const[year,setYear]=useState(now.getFullYear());
  const[month,setMonth]=useState(now.getMonth());
  const[monthData,loading,weeks]=useMonthlyPulse(year,month);

  // Sales pipeline from custom items + pulse
  const salesEntities=custom['sales']||[];
  const salesData=monthData['sales']||{};
  const getLatest=(secData,itemId,field)=>{
    const entries=secData[itemId]||[];
    const vals=entries.map(e=>parseFloat(e[field])).filter(v=>!isNaN(v));
    return vals.length?vals[vals.length-1]:null;
  };
  const signedEntities=salesEntities.filter(e=>{
    const entries=(salesData[e.id]||[]);
    const lastStatus=entries.map(e=>e.status).filter(Boolean).pop();
    return lastStatus==='active'||lastStatus==='mrpa';
  });
  const totalSignedInitial=signedEntities.reduce((s,e)=>s+(getLatest(salesData,e.id,'prevWeek')||0),0);
  const totalMonthlyEst=salesEntities.reduce((s,e)=>s+(getLatest(salesData,e.id,'comingWeek')||0),0);
  const pipelineByStage=STAGE_LIST.map(st=>{
    const stId=st[0],stLabel=st[1],stColor=st[2];
    const count=salesEntities.filter(e=>{
      const entries=salesData[e.id]||[];
      return (entries.map(x=>x.status).filter(Boolean).pop()||'')=== stId;
    }).length;
    return{id:stId,label:stLabel,color:stColor,count};
  });

  // Cross-dept stats - memoized
  const sectionStats=SECTIONS.map(sec=>{
    const sd=monthData[sec.id]||{};
    const all=[...sec.items,...(custom[sec.id]||[])].filter(i=>!i.id.startsWith('__'));
    const statuses=all.flatMap(i=>(sd[i.id]||[]).map(e=>e.status)).filter(Boolean);
    const blk=statuses.filter(s=>s==='Blocked').length;
    const onT=statuses.filter(s=>s==='On-Track'||s==='Done'||s==='On Track').length;
    const doneEntries=(sd['__done']||[]).map(e=>e.prevWeek).filter(Boolean);
    const nextEntry=(sd['__next']||[]).map(e=>e.prevWeek).filter(Boolean).pop()||'';
    const reporting=doneEntries.length>0||statuses.length>0;
    return{sec,blk,onT,doneEntries,nextEntry,reporting,kpiCount:all.length,filled:statuses.length};
  });

  const openTasks=(tasks||[]).filter(t=>!t.done);
  const highPrio=openTasks.filter(t=>t.priority==='High').length;
  const totalBlocked=sectionStats.reduce((s,x)=>s+x.blk,0);
  const reportingDepts=sectionStats.filter(s=>s.reporting).length;

  return html`

      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:10px">

            ${[2025,2026,2027].map(y=>html`<option key=${y} value=${y}>${y}</option>`)}
          </select>
        </div>
      </div>

      <!-- Hero KPIs -->
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px">
        ${[
          {lbl:'Pipeline signed AED',val:'AED '+totalSignedInitial.toLocaleString(),sub:signedEntities.length+' entities (MRPA+)',color:'var(--ok)',bg:'#f0fdf4'},
          {lbl:'Est. monthly revenue',val:'AED '+totalMonthlyEst.toLocaleString(),sub:'across '+salesEntities.length+' entities',color:'var(--accent)',bg:'#f0fdfa'},
          {lbl:'Open tasks',val:openTasks.length,sub:highPrio+' high priority',color:highPrio>0?'var(--err)':'#111827',bg:highPrio>0?'var(--err-bg)':'var(--surface)'},
          {lbl:'Depts reporting',val:reportingDepts+'/'+SECTIONS.length,sub:totalBlocked>0?totalBlocked+' blocked':'All clear',color:totalBlocked>0?'var(--err)':'#111827',bg:totalBlocked>0?'var(--err-bg)':'var(--surface)'},
        ].map(m=>html`
          <div key=${m.lbl} style="background:${m.bg};border:1px solid var(--border);border-radius:12px;padding:16px 20px">
            <div style="font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px">${m.lbl}</div>
            <div style="font-size:22px;font-weight:800;color:${m.color};letter-spacing:-.5px">${m.val}</div>
            <div style="font-size:11px;color:var(--faint);margin-top:3px">${m.sub}</div>

      <!-- Sales funnel -->
      ${salesEntities.length>0&&html`
        <div style="background:#fff;border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:24px">

function MemoGen({custom,tasks,okrs}){
  const now=new Date();
  const[year,setYear]=useState(now.getFullYear());
  const[month,setMonth]=useState(now.getMonth());
  const[monthData,mLoading,weeks]=useMonthlyPulse(year,month);
  const[memo,setMemo]=useState('');
  const[loading,setLoading]=useState(false);
  const[history,setHistory]=useState(()=>{try{return JSON.parse(localStorage.getItem('kpmo_memos')||'[]');}catch{return[];}});
  const[sel,setSel]=useState(null);
  const monthLabel=MONTHS[month]+' '+year;

  const generate=async()=>{
    if(!CL_OK){alert('Add your Claude API key in the CLAUDE_KEY field at the top of the HTML file.');return;}
    setLoading(true);setMemo('');
    const sections=SECTIONS.map(sec=>{
      const all=[...sec.items,...(custom[sec.id]||[])].filter(i=>!i.id.startsWith('__'));
      const sd=monthData[sec.id]||{};
      const doneUpdates=(sd['__done']||[]).map(e=>e.prevWeek).filter(Boolean);
      const nextUpdates=(sd['__next']||[]).map(e=>e.prevWeek).filter(Boolean);
      const sectionOkrs=(okrs?.[sec.id]?.objectives||[]).map(o=>({obj:o.title,inits:(o.initiatives||[]).map(i=>i.title)}));
      return{
        section:sec.label,
        okrs:sectionOkrs,
        kpis:all.map(i=>{const entries=sd[i.id]||[];const vals=entries.map(e=>parseFloat(e.prevWeek)).filter(v=>!isNaN(v));return{kpi:i.label,latestValue:vals[vals.length-1]??'',trend:vals.length>1?vals[vals.length-1]-vals[0]:null,statuses:entries.map(e=>e.status).filter(Boolean)};}),
        doneThisMonth:doneUpdates,
        nextPriorities:nextUpdates.slice(-1)
      };
    });
    const openTasks=tasks.filter(t=>!t.done).slice(0,10).map(t=>({task:t.title,assignee:t.assignee_name||'--',priority:t.priority,due:t.due_date||'',dept:t.kpi||''}));
    try{
      const res=await fetch('https://api.anthropic.com/v1/messages',{
        method:'POST',
        headers:{'Content-Type':'application/json','x-api-key':CLAUDE_KEY,'anthropic-version':'2023-06-01'},
        body:JSON.stringify({
          model:'claude-sonnet-4-20250514',
          max_tokens:2500,
          messages:[{role:'user',content:
            'You are Chief of Staff at Klaim, a GCC healthtech fintech (UAE, KSA, Oman). Draft a concise monthly executive memo for the CEO.\n\n'+
            'MONTH: '+monthLabel+' ('+weeks.length+' weeks of data)\n'+
            'DEPARTMENT DATA: '+JSON.stringify(sections)+'\n'+
            'OPEN TASKS: '+JSON.stringify(openTasks)+'\n\n'+
            'Format exactly as follows:\n\n'+
            'KLAIM | MONTHLY OPERATIONAL MEMO\n'+
            monthLabel+' | CEO Office\n\n'+
            'EXECUTIVE SUMMARY\n[3-4 direct sentences: business health, biggest win, biggest risk this month]\n\n'+
            'OKR PROGRESS BY DEPARTMENT\n[For each dept with OKRs: objective + initiative progress based on qualitative updates]\n\n'+
            'DEPARTMENT PERFORMANCE\n[Each dept: STATUS - key KPI numbers - what was done - what is next]\n\n'+
            'BLOCKERS\n[Bullet list. "None" if clean.]\n\n'+
            'OPEN ACTIONS (TOP 5)\n[[Dept] Task - assignee - due date]\n\n'+
            'PRIORITIES FOR NEXT MONTH\n[3-5 bullets]\n\n'+
            'Be direct and data-driven. No filler.'
          }]
        })
      });
      const d=await res.json();
      const text=d.content?.[0]?.text||'Error generating memo.';
      setMemo(text);setSel(null);
      const entry={id:uid(),monthLabel,text,date:new Date().toISOString()};
      setHistory(h=>{const n=[entry,...h.slice(0,9)];localStorage.setItem('kpmo_memos',JSON.stringify(n));return n;});
    }catch(e){
      setMemo('Error: could not reach Claude API. Check your API key.');
    }
    setLoading(false);
  };

  const displayed=sel?history.find(m=>m.id===sel)?.text||'':memo;
  return html`
    <div>
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px;gap:16px;flex-wrap:wrap">
        <div>
          <p style="font-weight:700;font-size:15px;margin-bottom:4px">Weekly Memo Generator</p>
          <p style="font-size:13px;color:var(--muted);max-width:480px">
            Reads this week's pulse data and open tasks, then drafts a complete CEO-ready memo in seconds.
            Keeps the last 10 memos.
          </p>
        </div>
        <button class="btn btn-accent" style="font-size:14px;padding:10px 24px;display:flex;align-items:center;gap:8px" onClick=${generate} disabled=${loading}>
          <span class="${loading?'spin':''}">*</span>
          ${loading?'Generating...':'Generate memo for this week'}
        </button>
      </div>
      ${history.length>1&&html`
        <div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:14px;align-items:center">
          <span style="font-size:12px;color:var(--muted)">Past memos:</span>
          <button class="pill ${!sel?'on':''}" onClick=${()=>setSel(null)}>Latest</button>
          ${history.slice(1).map(m=>html`
            <button key=${m.id} class="pill ${sel===m.id?'on':''}" onClick=${()=>setSel(m.id)}>${m.weekLabel}</button>`)}
        </div>`}
      ${displayed
        ?html`
          <div class="memo-box">${displayed}</div>
          <div style="display:flex;gap:8px;margin-top:14px">
            <button class="btn btn-primary" onClick=${()=>navigator.clipboard.writeText(displayed)}>Copy memo</button>
            <button class="btn" onClick=${()=>{
              const a=document.createElement('a');
              a.href=URL.createObjectURL(new Blob([displayed],{type:'text/plain'}));
              a.download='Klaim-Memo-'+weekId+'.txt';
              a.click();
            }}>Download .txt</button>
          </div>`
        :html`
          <div class="empty" style="display:flex;flex-direction:column;align-items:center;gap:12px">
            <div style="font-size:36px">*</div>
            <div>Fill in the Weekly Pulse then click <strong>Generate memo</strong></div>
            ${!CL_OK&&html`<div style="color:var(--warn);font-size:12px">Add your Claude API key in the config section to enable this</div>`}
          </div>`}
    </div>`;
}

function downloadWeeklyRecap(weekId,pulseData,custom,tasks){
  const h2=t=>'<h2 style="font-family:Calibri;font-size:14pt;color:#111827;border-bottom:2px solid #0d9488">'+t+'</h2>';
  const h3=t=>'<h3 style="font-family:Calibri;font-size:11pt;color:#374151">'+t+'</h3>';
  const p=(t,s)=>'<p style="font-family:Calibri;font-size:11pt;'+(s||'')+'">' +t+'</p>';
  const tbl=(hdrs,rws)=>{let t='<table border="1" cellpadding="5" cellspacing="0" style="border-collapse:collapse;width:100%;font-family:Calibri;font-size:10pt">';t+='<tr>'+hdrs.map(h=>'<th style="background:#0d9488;color:#fff;text-align:left">'+h+'</th>').join('')+'</tr>';rws.forEach(r=>{t+='<tr>'+r.map((cell,i)=>'<td style="'+(i===0?'font-weight:bold':'')+'">'+( cell||'-')+'</td>').join('')+'</tr>';});return t+'</table>';};
  const rows=['<h1 style="font-family:Calibri;font-size:20pt;color:#0d9488">KLAIM - Weekly Recap</h1>'];
  rows.push(p(weekLabel(weekId)+' | '+new Date().toLocaleDateString(),'color:#6b7280'));
  rows.push('<hr style="border:1px solid #0d9488"/>');
  SECTIONS.forEach(sec=>{
    const sd=pulseData[sec.id]||{};
    const all=[...sec.items,...(custom[sec.id]||[])].filter(i=>!i.id.startsWith('__'));
    const done=sd['__done']?.prevWeek||'';
    const next=sd['__next']?.prevWeek||'';
    const kpis=all.filter(i=>sd[i.id]?.prevWeek||sd[i.id]?.comingWeek||sd[i.id]?.status);
    if(!kpis.length&&!done&&!next)return;
    rows.push(h2(sec.label));
    if(kpis.length)rows.push(tbl(['KPI','Last Week','Coming Week','Status'],kpis.map(i=>{const d=sd[i.id]||{};return[i.label,d.prevWeek,d.comingWeek,d.status];})));
    if(done){rows.push(h3('Done last week'));rows.push(p(done));}
    if(next){rows.push(h3('Next week'));rows.push(p(next,'color:#0d9488;font-weight:bold'));}
  });
  const ot=(tasks||[]).filter(t=>!t.done);
  if(ot.length){rows.push(h2('Open Tasks ('+ot.length+')'));rows.push(tbl(['Task','Assignee','Priority','Due'],ot.slice(0,20).map(t=>[t.title,t.assignee_name,t.priority,t.due_date])));}
  const html='<html><head><meta charset="utf-8"></head><body style="margin:40pt">'+rows.join('')+'</body></html>';
  const blob=new Blob([html],{type:'application/msword'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download='Klaim-Recap-'+weekId+'.doc';
  document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
}

const QUARTERS=['Q1-2026','Q2-2026','Q3-2026','Q4-2026','Q1-2027'];

function useOKR(quarter){
  const lsKey='klaim_okrs_'+quarter;
  const[okrs,setOkrs]=useState(()=>{try{return JSON.parse(localStorage.getItem(lsKey)||'{}');}catch{return {};}});
  const[saving,setSaving]=useState(false);
  useEffect(()=>{
    if(!IS_CONFIGURED||!sb){try{setOkrs(JSON.parse(localStorage.getItem(lsKey)||'{}'));}catch{}return;}
    sb.from('klaim_okrs').select('*').eq('quarter',quarter)
      .then(({data:rows})=>{
        const d={};(rows||[]).forEach(r=>{d[r.dept_id]=r.data||{objectives:[]};});
        setOkrs(d);try{localStorage.setItem(lsKey,JSON.stringify(d));}catch{}
      }).catch(()=>{});
  },[quarter]);
  const saveOKR=async(deptId,data)=>{
    setSaving(true);
    const updated={...okrs,[deptId]:data};
    setOkrs(updated);
    try{localStorage.setItem(lsKey,JSON.stringify(updated));}catch{}
    if(IS_CONFIGURED)await sb.from('klaim_okrs').upsert({id:quarter+':'+deptId,quarter,dept_id:deptId,data,updated_at:new Date().toISOString()});
    setSaving(false);
  };
  return[okrs,saveOKR,saving];
}

function ProgressRing({pct,color,size}){
  const sz=size||44;const r=(sz/2)-4;const circ=2*Math.PI*r;
  const p=Math.max(0,Math.min(100,pct||0));
  const offset=circ*(1-p/100);
  const cx=sz/2;
  return html`
    <svg width=${sz} height=${sz} viewBox=${'0 0 '+sz+' '+sz} style="flex-shrink:0">
      <circle cx=${cx} cy=${cx} r=${r} fill="none" stroke="#e5e7eb" stroke-width="4"/>
      <circle cx=${cx} cy=${cx} r=${r} fill="none" stroke=${color||'#0d9488'} stroke-width="4"
        stroke-dasharray=${circ} stroke-dashoffset=${offset} stroke-linecap="round"
        transform=${'rotate(-90 '+cx+' '+cx+')'}/>
      <text x=${cx} y=${cx+3} text-anchor="middle" font-size="11" font-weight="700" fill="#111827">${Math.round(p)+'%'}</text>
    </svg>`;
}

function initCompletion(init,pulseData){
  if(!init.src_section||!init.src_item||!(init.target>0))return null;
  const sd=pulseData[init.src_section]||{};
  const cell=sd[init.src_item]||{};
  const val=parseFloat(cell.prevWeek||cell.comingWeek);
  if(isNaN(val))return null;
  const pct=Math.min(100,Math.round(val/init.target*100));
  return{val,pct};
}

function MeetingNotes({weekId,updateCell,addTask,profile}){
  const[notes,setNotes]=useState('');
  const[loading,setLoading]=useState(false);
  const[result,setResult]=useState(null);
  const[err,setErr]=useState('');
  const dueDate=weekEndDate(weekId);

  const extract=async()=>{
    if(!notes.trim())return;
    setLoading(true);setResult(null);setErr('');
    if(!CL_OK){
      setErr('Add your Claude API key (CLAUDE_KEY) at the top of the file.');
      setLoading(false);return;
    }
    const deptList=SECTIONS.map(s=>s.id+' ('+s.label+')').join(', ');
    try{
      const res=await fetch('https://api.anthropic.com/v1/messages',{
        method:'POST',
        headers:{'Content-Type':'application/json','x-api-key':CLAUDE_KEY,'anthropic-version':'2023-06-01'},
        body:JSON.stringify({
          model:'claude-sonnet-4-20250514',max_tokens:1500,
          messages:[{role:'user',content:
            'Extract from these weekly pulse meeting notes: action items + department commitments for next week.\n'+
            'Departments: '+deptList+'\n'+
            'Return ONLY valid JSON:\n'+
            '{"tasks":[{"title":"...","assignee":"...","priority":"High|Medium|Low","dept_id":"dept_id_or_empty"}],'+
            '"commitments":[{"dept_id":"dept_id","text":"what this dept commits to next week"}]}\n\n'+
            'Week: '+weekId+'\nNotes:\n'+notes
          }]
        })
      });
      const d=await res.json();
      const txt=d.content?.[0]?.text||'';
      const parsed=JSON.parse(txt.replace(/```json|```/g,'').trim());
      (parsed.tasks||[]).forEach(t=>{
        addTask({id:uid(),title:t.title,assignee_name:t.assignee||'',assignee_email:'',
          priority:t.priority||'Medium',due_date:dueDate,
          kpi:SECTIONS.find(s=>s.id===t.dept_id)?.label||'',done:false,created_by:profile?.email});
      });
      (parsed.commitments||[]).forEach(cm=>{
        if(cm.dept_id&&cm.text)updateCell(cm.dept_id,'__next','prevWeek',cm.text,profile?.email);
      });
      setResult({tasksAdded:(parsed.tasks||[]).length,commitments:parsed.commitments||[]});
      setNotes('');
    }catch(e){setErr('Error: '+e.message);}
    setLoading(false);
  };

  return html`
    <div style="max-width:720px">
      <div style="margin-bottom:20px">
        <h2 style="font-size:18px;font-weight:700;margin-bottom:2px">Weekly Pulse Notes</h2>
        <p style="font-size:13px;color:var(--muted)">${weekLabel(weekId)}  ·  Tasks due ${dueDate}  ·  Commitments pushed to pulse</p>
      </div>
      <div class="form-blk">
        <textarea class="fi" rows="12" style="resize:vertical;line-height:1.65;font-size:13px"
          placeholder="Paste your weekly pulse meeting notes here..."
          value=${notes} onInput=${ev=>setNotes(ev.target.value)}/>
        <div style="margin-top:12px;display:flex;gap:10px;align-items:center">
          <button class="btn btn-primary" onClick=${extract} disabled=${loading||!notes.trim()}>
            ${loading?'Extracting...':'Extract & Push'}
          </button>
          ${err&&html`<span style="color:var(--err);font-size:12px">${err}</span>`}
        </div>
      </div>
      ${result&&html`
        <div style="background:#f0fdf4;border:1px solid #bbf7d0;border-radius:10px;padding:16px 20px">
          <div style="font-weight:600;font-size:13px;color:#15803d;margin-bottom:8px">Done — ${result.tasksAdded} tasks added · ${result.commitments.length} depts updated</div>
          ${result.commitments.map((cm,i)=>html`
            <div key=${i} style="font-size:12px;color:#166534;padding:2px 0">
              <strong>${SECTIONS.find(s=>s.id===cm.dept_id)?.label||cm.dept_id}:</strong> ${cm.text}
            </div>`)}
        </div>`}
    </div>`;
}

function weekEndDate(weekId){
  // Returns YYYY-MM-DD for the Sunday of the given ISO week
  const[y,w]=weekId.split('-W').map(Number);
  const jan4=new Date(y,0,4);
  const mon=new Date(jan4);
  mon.setDate(jan4.getDate()-(jan4.getDay()||7)+1+(w-1)*7);
  const sun=new Date(mon);sun.setDate(mon.getDate()+6);
  return sun.toISOString().slice(0,10);
}

function AIAssistant({pulseData,updateCell,profile,weekId,okrs,saveOKR}){
  const[open,setOpen]=useState(false);
  const[input,setInput]=useState('');
  const[msgs,setMsgs]=useState([]);
  const[busy,setBusy]=useState(false);
  const[listening,setListening]=useState(false);
  const recRef=useRef(null);

  const startVoice=()=>{
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR){setMsgs(m=>[...m,{role:'sys',text:'Voice not supported in this browser. Use Chrome.'}]);return;}
    const r=new SR();r.lang='en-US';r.interimResults=false;r.maxAlternatives=1;
    r.onresult=(e)=>{const t=e.results[0][0].transcript;setInput(v=>(v?v+' ':'')+t);};
    r.onend=()=>setListening(false);
    r.onerror=()=>setListening(false);
    recRef.current=r;r.start();setListening(true);
  };
  const stopVoice=()=>{if(recRef.current)recRef.current.stop();setListening(false);};

  const buildContext=()=>{
    const secs=SECTIONS.map(s=>({
      id:s.id,label:s.label,
      kpis:s.items.map(it=>({id:it.id,label:it.label,current:(pulseData[s.id]||{})[it.id]||{}}))
    }));
    const okrCtx=SECTIONS.map(s=>({section:s.id,objectives:((okrs&&okrs[s.id]&&okrs[s.id].objectives)||[]).map(o=>({title:o.title,initiatives:(o.initiatives||[]).map(i=>i.title)}))}));
    return{secs,okrCtx};
  };

  const send=async()=>{
    const text=input.trim();if(!text||busy)return;
    setMsgs(m=>[...m,{role:'user',text}]);setInput('');setBusy(true);
    const{secs,okrCtx}=buildContext();
    const sys='You are the Klaim Chief of Staff assistant. The user gives you verbal updates about what happened across departments. Map each piece of information to the correct department KPI and field, and return ONLY valid JSON (no markdown, no prose) of the form: {"updates":[{"section":"<section_id>","item":"<kpi_id>","field":"prevWeek|comingWeek|status|comments","value":"<string>"}],"reply":"<short confirmation of what you updated>"}. Rules: section must be one of the given section ids. item must be one of that section kpi ids. field prevWeek = what was achieved/current value, comingWeek = target/next, status one of On-Track,At-Risk,Blocked,Done,Delayed, comments = free text note. Only include updates you are confident about. Here are the departments and their KPIs with current values: '+JSON.stringify(secs)+'. Here are the OKRs for context: '+JSON.stringify(okrCtx)+'. Current week: '+weekId+'.';
    try{
      const res=await fetch('/api/proxy',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({model:'gpt-oss:120b-cloud',max_tokens:1500,messages:[{role:'user',content:sys+'\n\nUser update: '+text}]})
      });
      if(!res.ok){setMsgs(m=>[...m,{role:'sys',text:'Assistant not configured yet. Add api/proxy.js + ANTHROPIC_API_KEY in Vercel (status '+res.status+').'}]);setBusy(false);return;}
      const data=await res.json();
      let raw=((data.choices&&data.choices[0]&&data.choices[0].message&&data.choices[0].message.content)||(Array.isArray(data.content)?data.content.filter(b=>b.type==='text').map(b=>b.text).join(''):'')||'').trim();
      raw=raw.replace(/```json/g,'').replace(/```/g,'').trim();
      let parsed=null;try{parsed=JSON.parse(raw);}catch(e){parsed=null;}
      if(!parsed||!parsed.updates){setMsgs(m=>[...m,{role:'sys',text:'I could not parse that into updates. Try rephrasing with the department and metric.'}]);setBusy(false);return;}
      let applied=0;
      parsed.updates.forEach(u=>{
        const sec=SECTIONS.find(s=>s.id===u.section);
        if(!sec)return;
        const it=sec.items.find(x=>x.id===u.item);
        if(!it)return;
        const fld=['prevWeek','comingWeek','status','comments'].indexOf(u.field)>=0?u.field:'prevWeek';
        updateCell(u.section,u.item,fld,String(u.value),profile&&profile.email);
        applied++;
      });
      const conf=parsed.reply||('Applied '+applied+' update(s).');
      setMsgs(m=>[...m,{role:'ai',text:conf,count:applied}]);
    }catch(e){
      setMsgs(m=>[...m,{role:'sys',text:'Error: '+e.message}]);
    }
    setBusy(false);
  };

  return html`
    <div>
      ${open?html`<div style="position:fixed;bottom:90px;right:24px;width:380px;max-width:calc(100vw - 32px);height:520px;max-height:calc(100vh - 130px);background:#fff;border:1px solid var(--border);border-radius:16px;box-shadow:0 12px 40px rgba(0,0,0,.18);z-index:300;display:flex;flex-direction:column;overflow:hidden">
        <div style="padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px">
          <div style="width:28px;height:28px;border-radius:50%;background:#6135FC;color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700">K</div>
          <div style="flex:1">
            <div style="font-size:13px;font-weight:700">Klaim Assistant</div>
            <div style="font-size:10px;color:var(--muted)">Speak or type an update</div>
          </div>
          <button class="icon-btn" onClick=${()=>setOpen(false)}>X</button>
        </div>
        <div style="flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px">
          ${msgs.length===0?html`<div style="font-size:12px;color:var(--faint);line-height:1.6">Tell me what happened this week and I'll update the right departments. For example:<br/><br/><em>"Oman got the FSA sandbox approval, escrow with Sohar is in progress. Sales signed 2 MRPAs this week."</em></div>`:html`<div></div>`}
          ${msgs.map((m,mi)=>{
            const isU=m.role==='user';const isSys=m.role==='sys';
            const bg=isU?'#6135FC':isSys?'#fef2f2':'#f0fdfa';
            const fc=isU?'#fff':isSys?'#dc2626':'#0f766e';
            const al=isU?'flex-end':'flex-start';
            return html`<div key=${'m'+mi} style=${'align-self:'+al+';max-width:85%;background:'+bg+';color:'+fc+';padding:8px 12px;border-radius:12px;font-size:12px;line-height:1.5;white-space:pre-wrap'}>${m.text}</div>`;
          })}
          ${busy?html`<div style="align-self:flex-start;font-size:12px;color:var(--muted)">Thinking...</div>`:html`<div></div>`}
        </div>
        <div style="padding:12px;border-top:1px solid var(--border);display:flex;gap:6px;align-items:flex-end">
          <button onClick=${listening?stopVoice:startVoice} title="Voice input" style=${'width:36px;height:36px;border-radius:50%;border:none;cursor:pointer;flex-shrink:0;font-size:15px;background:'+(listening?'#dc2626':'var(--surface)')+';color:'+(listening?'#fff':'var(--muted)')}>${listening?'\u25a0':'\ud83c\udfa4'}</button>
          <textarea value=${input} onInput=${e=>setInput(e.target.value)} rows="1" placeholder="Type or speak an update..." onKeyDown=${e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}}} style="flex:1;resize:none;font-family:inherit;font-size:13px;border:1px solid var(--border);border-radius:10px;padding:9px 10px;max-height:80px"></textarea>
          <button onClick=${send} disabled=${busy||!input.trim()} style="width:36px;height:36px;border-radius:50%;border:none;cursor:pointer;flex-shrink:0;background:#6135FC;color:#fff;font-size:15px">\u2191</button>
        </div>
      </div>`:html`<div></div>`}
      <button onClick=${()=>setOpen(o=>!o)} title="Klaim Assistant" style=${'position:fixed;bottom:24px;right:24px;width:56px;height:56px;border-radius:50%;border:none;cursor:pointer;z-index:300;background:#6135FC;color:#fff;font-size:22px;box-shadow:0 6px 20px rgba(97,53,252,.4);display:flex;align-items:center;justify-content:center'}>${open?'\u2715':'\u2728'}</button>
    </div>`;
}

function App(){
  const{user,profile,loading,error,signIn,signOut,updateProfile}=useAuth();
  const curQ=()=>{const m=new Date().getMonth();return 'Q'+(Math.floor(m/3)+1)+'-'+new Date().getFullYear();};
  const[activeOkrs]=useOKR(curQ());
  const[weekId,setWeekId]=useState(isoWeek());
  const[pulseData,updateCell,pulseLoading]=usePulse(weekId);
  const[custom,addCustom,removeCustom]=useCustom();
  const[tasks,addTask,updTask,delTask]=useTasks();
  const[fus,addFu,updFu,delFu]=useFUs();

  if(loading) return html`
    <div style="display:flex;align-items:center;justify-content:center;height:100vh;color:var(--muted);font-size:13px">
      Loading...
    </div>`;

  if(!user) return html`<${LoginScreen} onSignIn=${signIn} error=${error}/>`;

  if(!profile?.name) return html`
    <${ProfileSetup} profile=${profile} onSave=${updateProfile} onSignOut=${signOut}/>`;

  const isAdmin=profile?.role==='admin';
  const pendingFU=fus.filter(f=>f.status==='Pending').length;
  const openTasks=tasks.filter(t=>!t.done).length;

  const SECTIONS_NAV={
    weekly:['pulse','meetings',...(isAdmin?['people','fus']:[])],
    monthly:isAdmin?['dash','memo']:['dash'],
    quarterly:['okr']
  };
  const NAV_LABELS={
    pulse:'Weekly Pulse',meetings:'Weekly Notes',people:'People & Tasks',
    fus:'Follow-ups',memo:'Generate Memo',dash:'Monthly Dashboard',okr:'Quarterly OKR'
  };
  const NAV_BADGES={people:openTasks,fus:pendingFU};
  const[period,setPeriod]=useState('weekly');
  const[tab,setTab]=useState('pulse');
  const switchPeriod=(p)=>{setPeriod(p);setTab(SECTIONS_NAV[p][0]);};
  const[menuOpen,setMenuOpen]=useState(false);
  const[showUsers,setShowUsers]=useState(false);
  const roleLabel=profile?.role==='admin'?'Admin':profile?.role==='head'?'Dept Head':'Viewer';
  const roleClr=profile?.role==='admin'?'#6135FC':profile?.role==='head'?'#0d9488':'#6b7280';

  return html`
    <div>
      <div class="top-bar">
        <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
          <span class="logo">Klaim<em style="color:var(--accent);font-style:normal">.</em></span>
          <div style="display:flex;gap:2px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:2px">
            ${['weekly','monthly','quarterly'].map(p=>html`
              <button key=${p} onClick=${()=>switchPeriod(p)}
                style="font-size:12px;font-weight:${period===p?'700':'500'};padding:5px 14px;border-radius:6px;border:none;cursor:pointer;font-family:inherit;background:${period===p?'#fff':'transparent'};color:${period===p?'#111827':'var(--muted)'};box-shadow:${period===p?'0 1px 3px rgba(0,0,0,.1)':'none'};text-transform:capitalize;transition:all .15s">
                ${p==='weekly'?'Weekly':p==='monthly'?'Monthly':'Quarterly'}
              </button>`)}
          </div>
        </div>
        ${(tab==='pulse')&&html`<div class="week-nav">
          <button class="btn-nav" onClick=${()=>setWeekId(w=>shiftWeek(w,-1))}>Prev</button>
          <span class="week-lbl">${weekLabel(weekId)}</span>
          <button class="btn-nav" onClick=${()=>setWeekId(w=>shiftWeek(w,1))}>Next</button>
          <button class="btn-now" onClick=${()=>setWeekId(isoWeek())}>Now</button>
          <button class="btn-nav" style="border-color:var(--accent);color:var(--accent)" onClick=${()=>downloadWeeklyRecap(weekId,pulseData,custom,tasks)} title="Download weekly recap">↓ Recap</button>
        </div>`}
        <div class="user-bar" style="position:relative">
          <button onClick=${()=>setMenuOpen(o=>!o)} style="display:flex;align-items:center;gap:8px;background:none;border:none;cursor:pointer;font-family:inherit;padding:4px 6px;border-radius:8px">
            <div class="avatar">${initials(profile.name)}</div>
            <div style="text-align:left">
              <div style="font-size:13px;font-weight:500">${profile.name}</div>
              <div style="font-size:11px;color:var(--muted)">${profile.email}</div>
            </div>
            <span style="font-size:10px;color:var(--faint);margin-left:2px">${menuOpen?'▲':'▼'}</span>
          </button>
          ${menuOpen?html`<div style="position:absolute;top:100%;right:0;margin-top:6px;background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.12);min-width:220px;z-index:50;overflow:hidden">
            <div style="padding:12px 14px;border-bottom:1px solid var(--border)">
              <div style="font-size:13px;font-weight:600">${profile.name}</div>
              <div style="font-size:11px;color:var(--muted);margin-bottom:5px">${profile.email}</div>
              <span style="font-size:10px;padding:2px 8px;border-radius:999px;color:#fff;font-weight:600;background:${roleClr}">${roleLabel}</span>
            </div>
            ${isAdmin?html`<button onClick=${()=>{setShowUsers(true);setMenuOpen(false);}} style="display:block;width:100%;text-align:left;padding:10px 14px;background:none;border:none;cursor:pointer;font-family:inherit;font-size:13px;color:#111827">User Management</button>`:html`<span></span>`}
            <button onClick=${()=>{setMenuOpen(false);signOut();}} style="display:block;width:100%;text-align:left;padding:10px 14px;background:none;border:none;border-top:1px solid var(--border);cursor:pointer;font-family:inherit;font-size:13px;color:var(--err)">Sign out</button>
          </div>`:html`<span></span>`}
        </div>
      </div>

      <div class="tabs">
        ${SECTIONS_NAV[period].map(id=>html`
          <button key=${id} class="tab ${tab===id?'on':''}" onClick=${()=>setTab(id)}>
            ${NAV_LABELS[id]}
            ${(NAV_BADGES[id]||0)>0&&html`<span class="tab-ct">${NAV_BADGES[id]}</span>`}
          </button>`)}
      </div>

      ${showUsers?html`<${UserManagement} profile=${profile} onClose=${()=>setShowUsers(false)}/>`:html`<span></span>`}
      <${AIAssistant} pulseData=${pulseData} updateCell=${updateCell} profile=${profile} weekId=${weekId} okrs=${activeOkrs}/>
      <div class="page">
        ${tab==='pulse'&&html`
          <${WeeklyPulse}
            weekId=${weekId} data=${pulseData} updateCell=${updateCell}
            custom=${custom} addCustom=${addCustom} removeCustom=${removeCustom}
            loading=${pulseLoading} profile=${profile} okrs=${activeOkrs}/>`}
        ${tab==='dash'&&html`<${Dashboard} custom=${custom} tasks=${tasks} okrs=${activeOkrs}/>`}
        ${tab==='okr'&&html`<${OKRView} pulseData=${pulseData} profile=${profile} weekId=${weekId}/>`}
        ${tab==='people'&&isAdmin&&html`
          <${PeopleTasks} tasks=${tasks} addTask=${addTask} updTask=${updTask} delTask=${delTask} profile=${profile}/>`}
        ${tab==='fus'&&isAdmin&&html`
          <${FollowUps} fus=${fus} addFu=${addFu} updFu=${updFu} delFu=${delFu}/>`}
        ${tab==='meetings'&&html`<${MeetingNotes} weekId=${weekId} updateCell=${updateCell} addTask=${addTask} profile=${profile}/>`}
        ${tab==='memo'&&isAdmin&&html`
          <${MemoGen} custom=${custom} tasks=${tasks} okrs=${activeOkrs}/>`}
      </div>
    </div>`;
}


class ErrorBoundary extends window.preact.Component{
  constructor(p){super(p);this.state={err:null};}
  componentDidCatch(e){this.setState({err:e});}
  render(){
    if(this.state.err)return html`<div style="padding:2rem;color:#dc2626;font-family:monospace;font-size:12px;white-space:pre-wrap;max-width:800px"><strong>Error (share this with your developer):</strong><br/>${this.state.err.message}<br/>${this.state.err.stack}</div>`;
    return this.props.children;
  }
}
preactRender(html`<${ErrorBoundary}><${App}/></${ErrorBoundary}>`,document.getElementById('root'))

</script>
</body>
</html>
